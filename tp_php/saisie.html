<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Saisie des notes</title>
</head>
<body>
    <h2>Saisie des notes d'un apprenant (POST)</h2>
    <form action="traitement.php" method="POST">
        <label>Nom de l'apprenant : <input type="text" name="nom" required></label><br><br>
        <label>Note Informatique : <input type="number" step="0.5" name="note_info" required></label><br><br>
        <label>Note Mathématiques : <input type="number" step="0.5" name="note_math" required></label><br><br>
        <button type="submit">Enregistrer</button>
    </form>
</body>
</html>
